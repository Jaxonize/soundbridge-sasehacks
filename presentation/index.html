<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundBridge judging presentation</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#252d23;color:#f7f6f2;font-family:Arial,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}main{width:min(100vw,calc((100dvh - 75px)*16/9));aspect-ratio:16/9;position:relative}img{width:100%;height:100%;object-fit:contain;display:none}img.active{display:block}footer{height:75px;display:flex;align-items:center;justify-content:center;gap:22px;width:100%;font-size:13px}button,a{background:#3e4b36;color:#f7f6f2;border:1px solid #647454;border-radius:7px;padding:10px 15px;font:inherit;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#566a47}button:focus-visible,a:focus-visible{outline:3px solid #eeb784;outline-offset:4px}button:disabled{opacity:.4;cursor:default}span{min-width:40px;text-align:center;font-variant-numeric:tabular-nums}.hint{font-size:11px;color:#bec8b5;position:fixed;top:10px;right:12px;display:none}@media(max-width:600px){footer{gap:10px;font-size:11px}button,a{padding:10px}.source{display:none}}
  </style>
</head>
<body>
  <main aria-label="SoundBridge six-slide judging presentation">
    <img src="slides/slide-1.png" alt="SoundBridge. A little sound. A lot of connection. Everyday sound help, from one person to another." class="active">
    <img src="slides/slide-2.png" alt="Everyday sound has context. Was that my name? What did that announcement say? The person asking decides what to share and what to ask.">
    <img src="slides/slide-3.png" alt="A person on the other end. Ask for help with a nickname and optional camera check. Meet a volunteer on a video call with text and visible attention cues. Screenshot of the phone app.">
    <img src="slides/slide-4.png" alt="Technical implementation. WebRTC for media. Supabase Edge Functions for session authentication. Postgres transactions for matching and cleanup. React on Vercel for the web app.">
    <img src="slides/slide-5.png" alt="A campus pilot proposal. Deaf and hard-of-hearing students can request context. Student volunteers and accessibility organizations can help. Access would remain free for users, supported by campus partners.">
    <img src="slides/slide-6.png" alt="Your world, a little clearer. The live app is at soundbridge-sasehacks.vercel.app. The team controls the Devpost submission.">
  </main>
  <footer><button id="previous" aria-label="Previous slide">← Previous</button><span id="counter" aria-live="polite">1 / 6</span><button id="next" aria-label="Next slide">Next →</button><button id="fullscreen">Full screen</button><a class="source" href="SoundBridge-judging.pptx">PowerPoint</a></footer>
  <script>
    const slides=[...document.querySelectorAll('main img')];let current=0;
    function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((s,i)=>s.classList.toggle('active',i===current));document.querySelector('#counter').textContent=`${current+1} / ${slides.length}`;document.querySelector('#previous').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;}
    document.querySelector('#previous').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);
    document.querySelector('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.querySelector('#fullscreen').textContent='Use browser full screen';}};
    document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1);}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1);}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);});show(0);
  </script>
</body>
</html>
